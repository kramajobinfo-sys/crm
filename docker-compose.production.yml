name: krama-crm-production

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_NAME: ${APP_NAME:-Krama CRM}
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./deployment/storage:/var/www/backend/storage/app:ro
    depends_on:
      - backend
    networks: [krama]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: ${KRAMA_ENV_FILE:-.env}
    volumes:
      - ./deployment/storage:/var/www/backend/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [krama]

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: ${KRAMA_ENV_FILE:-.env}
    command: php artisan queue:work --tries=3 --sleep=2 --timeout=120 --queue=default,emails,reports,webhooks,integrations,ai
    volumes:
      - ./deployment/storage:/var/www/backend/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [krama]

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: ${KRAMA_ENV_FILE:-.env}
    command: /bin/sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./deployment/storage:/var/www/backend/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [krama]

  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-krama_crm}
      MYSQL_USER: ${DB_USERNAME:-krama}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployment/database/krama_crm.sql:/docker-entrypoint-initdb.d/001-krama-crm.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [krama]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [krama]

volumes:
  mysql_data:
  redis_data:

networks:
  krama:
    driver: bridge
