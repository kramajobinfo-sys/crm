name: krama-crm
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: krama_nginx
    restart: unless-stopped
    ports: ["8000:80"]
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [krama]

  backend:
    build: { context: ./docker/php, dockerfile: Dockerfile }
    container_name: krama_backend
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes: ["./backend:/var/www/backend"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [krama]

  queue:
    build: { context: ./docker/php, dockerfile: Dockerfile }
    container_name: krama_queue
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes: ["./backend:/var/www/backend"]
    command: php artisan queue:work --tries=3 --sleep=2 --timeout=120 --queue=default,emails,reports,webhooks,integrations,ai
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    networks: [krama]

  scheduler:
    build: { context: ./docker/php, dockerfile: Dockerfile }
    container_name: krama_scheduler
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes: ["./backend:/var/www/backend"]
    command: /bin/sh -c "while true; do php artisan schedule:run; sleep 60; done"
    depends_on:
      mysql: { condition: service_healthy }
    networks: [krama]

  frontend:
    image: node:20-alpine
    container_name: krama_frontend
    restart: unless-stopped
    working_dir: /app
    ports: ["8081:5173"]
    volumes: ["./frontend:/app"]
    # Source is bind-mounted and Vite applies normal UI edits through HMR. Do not restart this
    # service after each frontend edit: that drops every open browser's module/WebSocket session.
    # Install only when the dependency directory is genuinely missing.
    command: /bin/sh -c "test -x node_modules/.bin/vite || npm install; exec npm run dev -- --host"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s
    networks: [krama]

  mysql:
    image: mysql:8.0
    container_name: krama_mysql
    restart: unless-stopped
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-krama_crm}
      MYSQL_USER: ${DB_USERNAME:-krama}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [krama]

  redis:
    image: redis:7-alpine
    container_name: krama_redis
    restart: unless-stopped
    ports: ["6380:6379"]
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes: ["redis_data:/data"]
    networks: [krama]

  # Dev-only SMTP catcher for the Email module — no real outbound provider is configured by
  # default, so point an email_accounts row at host "mailpit" port 1025 (no auth/encryption) to
  # send-and-inspect locally. Web UI at http://localhost:8025. Not used by anything unless a
  # tenant configures an account against it.
  mailpit:
    image: axllent/mailpit:latest
    container_name: krama_mailpit
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]
    networks: [krama]

volumes:
  mysql_data:
  redis_data:

networks:
  krama:
    driver: bridge
