memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
date.timezone = UTC
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 50000
; The Laravel source is bind-mounted from Windows. Re-statting every PHP file on each request is
; extremely expensive on Docker Desktop and made small API calls take 3-5 seconds. Keep compiled
; files until the container restarts; `docker compose restart backend` reloads backend changes.
opcache.validate_timestamps = 0
realpath_cache_size = 16384K
realpath_cache_ttl = 600
