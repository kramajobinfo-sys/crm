# Cache policy: the HTML shell always revalidates (new deploys picked up without a
# hard refresh); fingerprinted /assets/* are immutable and cached for a year.
map $uri $cache_control {
    default      "no-cache";
    ~*^/assets/  "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64M;
    server_tokens off;

    # Docker's embedded DNS. Without this, nginx resolves `backend` once at startup and
    # caches that IP forever — so when the backend container is recreated on a deploy and
    # Docker hands it a new IP, every /api request 502s until the web container is restarted.
    # Re-resolving on a short TTL lets nginx follow the backend to its new IP on its own.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|up|ready)(/|$) {
        try_files "" @laravel;
    }

    location @laravel {
        include fastcgi_params;
        # Passing the upstream through a variable forces per-request DNS resolution (via the
        # resolver above), instead of the one-shot resolve nginx does for a literal host.
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization if_not_empty;
        fastcgi_param HTTP_X_API_KEY $http_x_api_key if_not_empty;
        fastcgi_read_timeout 120;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $cache_control always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
